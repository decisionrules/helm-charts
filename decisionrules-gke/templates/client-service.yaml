{{- if .Values.client.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-client-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "decisionrules.client.labels" . | nindent 4 }}
  {{- if .Values.ingress.enabled }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
    cloud.google.com/backend-config: '{"default": "{{ include "decisionrules.client.backendConfigName" . }}"}'
  {{- end }}
spec:
  selector:
    app: {{ .Release.Name }}-client
  ports:
    - port: {{ .Values.client.port }}
      targetPort: {{ .Values.client.port }}
      protocol: TCP
{{- end }}
