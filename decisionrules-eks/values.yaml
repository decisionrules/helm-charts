namespace: decisionrules

secrets:
  # Name of an existing Kubernetes Secret (in the same namespace) to read sensitive values from.
  # Required keys: LICENSE_KEY, MONGO_DB_URI, REDIS_URL — plus BI_MONGO_DB_URI when bi.enabled=true.
  # Set the Secret NAME here, never the secret values themselves. The Secret can be created via
  # kubectl, External Secrets Operator, Sealed Secrets, etc. — see the chart README for examples.
  # When set, the env values REDIS_URL, MONGO_DB_URI, LICENSE_KEY and BI_MONGO_DB_URI below are ignored.
  # When empty, the chart falls back to the plain env values below (not recommended for production).
  existingSecret: ""

bi:
  enabled: false

ai:
  enabled: false

# Rule solver the server is sized for. Selects one of the solverProfiles below.
#   aero (default) - Aero (V2) solver or mixed V1/V2 traffic
#   gaia           - classic Gaia (V1) solver
# resources.server and autoscalingServer.minReplicas/maxReplicas override the selected profile when set.
solver: aero

# Server CPU/memory and autoscaling range for each rule solver.
solverProfiles:
  # Aero uses several CPUs within one process, so it runs best on fewer, larger replicas.
  aero:
    resources:
      requests:
        cpu: 4000m
        memory: 8Gi
      limits:
        cpu: 4000m
        memory: 8Gi
    minReplicas: 2
    maxReplicas: 5
  gaia:
    resources:
      requests:
        cpu: 1000m
        memory: 1Gi
      limits:
        cpu: 2000m
        memory: 2Gi
    minReplicas: 2
    maxReplicas: 10

env:
  client:
    API_URL: "" # to be filled by user
    BI_API_URL: "" # to be filled by user
  server:
    REDIS_URL: "" # to be filled by user (ignored when secrets.existingSecret is set)
    MONGO_DB_URI: "" # to be filled by user (ignored when secrets.existingSecret is set)
    CLIENT_URL: "" # to be filled by user
    API_URL: "" # to be filled by user
    LICENSE_KEY: "" # to be filled by user (ignored when secrets.existingSecret is set)
    WORKERS_NUMBER: "1"
    RF_TIMEOUT: "5000"
    SR_TIMEOUT: "5000"
    WORKFLOW_TIMEOUT: "10000"
    FLUSH_REDIS_ON_STARTUP: "false"
    IN_MEMORY_RULE_COUNT: "100"
    CONNECTION_TIMEOUT: "60000"
    REDIS_PING_INTERVAL: "300000"
  bi:
    BI_MONGO_DB_URI: "" # to be filled by user (ignored when secrets.existingSecret is set)

images:
  client: decisionrules/client # can specify a specific version
  server: decisionrules/server # can specify a specific version
  bi: decisionrules/business-intelligence # can specify a specific version
  ai: decisionrules/ai-engine # can specify a specific version

resources:
  client:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Empty = taken from solverProfiles (see solver above). Set requests/limits here to override it.
  server: {}
  bi:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  ai:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

replicaCount:
  client: 2
  server: 2
  bi: 2
  ai: 2

autoscalingServer:
  # Empty = taken from solverProfiles (see solver above). Set a number to override it.
  minReplicas:
  maxReplicas:
  targetCPUUtilizationPercentage: 60
