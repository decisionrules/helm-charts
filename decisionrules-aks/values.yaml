namespace: decisionrules

bi:
  enabled: false

ai:
  enabled: false

# Rule solver the server is sized for:
#   aero (default) - Aero (V2) solver or mixed V1/V2 traffic: 4000m CPU / 8Gi memory
#                    (requests = limits) per server Pod, autoscaling 2-5 Pods
#   gaia           - classic Gaia (V1) solver: 1000m / 1Gi requests, 2000m / 2Gi limits,
#                    autoscaling 2-10 Pods
# resources.server and autoscalingServer.minReplicas/maxReplicas override the profile when set.
solver: aero

env:
  client:
    API_URL: "" # to be filled by user
    BI_API_URL: "" # to be filled by user
  server:
    REDIS_URL: "" # to be filled by user
    MONGO_DB_URI: "" # to be filled by user
    CLIENT_URL: "" # to be filled by user
    API_URL: "" # to be filled by user
    LICENSE_KEY: "" # to be filled by user
    WORKERS_NUMBER: "1"
    RF_TIMEOUT: "5000"
    SR_TIMEOUT: "5000"
    WORKFLOW_TIMEOUT: "10000"
    FLUSH_REDIS_ON_STARTUP: "false"
    IN_MEMORY_RULE_COUNT: "100"
    CONNECTION_TIMEOUT: "60000"
    REDIS_PING_INTERVAL: "300000"
  bi:
    BI_MONGO_DB_URI: "" # to be filled by user

images:
  client: decisionrules/client # can specify a specific version
  server: decisionrules/server # can specify a specific version
  bi: decisionrules/business-intelligence # can specify a specific version
  ai: decisionrules/ai-engine # can specify a specific version

resources:
  client:
    requests:
      cpu: 250m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  # Empty = sized by the solver profile (see solver above). Set requests/limits here to override it.
  server: {}
  bi:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  ai:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi

replicaCount:
  client: 2
  server: 2
  bi: 2
  ai: 2

autoscalingServer:
  # Empty = taken from the solver profile (aero: 2-5, gaia: 2-10). Set a number to override it.
  minReplicas:
  maxReplicas:
  targetCPUUtilizationPercentage: 60
